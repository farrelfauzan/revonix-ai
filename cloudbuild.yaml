steps:
  # ─── Build API ───
  - id: 'build-api'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/api/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:latest'
      - '.'

  # ─── Build Chat ───
  - id: 'build-chat'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/chat/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://api.${_DOMAIN}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:latest'
      - '.'
    waitFor: ['-']

  # ─── Build Dashboard ───
  - id: 'build-dashboard'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/dashboard/Dockerfile'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_URL=https://api.${_DOMAIN}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/dashboard:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/dashboard:latest'
      - '.'
    waitFor: ['-']

  # ─── Build Landing ───
  - id: 'build-landing'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'apps/landing/Dockerfile'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:latest'
      - '.'
    waitFor: ['-']

  # ─── Push All Images ───
  - id: 'push-images'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:latest &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:latest &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/dashboard:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/dashboard:latest &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:${SHORT_SHA} &
        docker push ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:latest &
        wait
    waitFor: ['build-api', 'build-chat', 'build-dashboard', 'build-landing']

  # ─── Run Prisma Migrations ───
  - id: 'migrate'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker run --rm \
          -e DATABASE_URL="$$DATABASE_URL" \
          ${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${SHORT_SHA} \
          npx prisma migrate deploy
    secretEnv: ['DATABASE_URL']
    waitFor: ['push-images']

  # ─── Deploy API to Cloud Run ───
  - id: 'deploy-api'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-api'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/api:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
    waitFor: ['migrate']

  # ─── Deploy Chat to Cloud Run ───
  - id: 'deploy-chat'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-chat'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/chat:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
    waitFor: ['push-images']

  # ─── Deploy Dashboard to Cloud Run ───
  - id: 'deploy-dashboard'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-dashboard'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/dashboard:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
    waitFor: ['push-images']

  # ─── Deploy Landing to Cloud Run ───
  - id: 'deploy-landing'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'renovix-landing'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/renovix/landing:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
    waitFor: ['push-images']

substitutions:
  _REGION: 'asia-southeast2'
  _DOMAIN: 'renovix.id'

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/database-url/versions/latest
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'
